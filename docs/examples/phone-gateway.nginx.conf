# Loopback-only gateway for one independent workbench instance.
# Replace WORKBENCH_PORT with the port shown by the Windows panel.
# Run with a private --prefix; do not replace /etc/nginx/nginx.conf.
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 128; }
http {
    access_log off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 127.0.0.1:18081;
        server_name _;
        client_max_body_size 50m;
        location = /internal { return 404; }
        location ^~ /internal/ { return 404; }
        location / {
            proxy_pass http://127.0.0.1:WORKBENCH_PORT;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
