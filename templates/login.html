<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>{{ title }} — Codex 工作台</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111620;color:#f2f4f7;font:16px system-ui,sans-serif}main{width:min(100%,400px);padding:28px;background:#171d29;border:1px solid #354052;border-radius:16px}h1{font-size:1.3rem}p{color:#b5bbc1;line-height:1.6}label{display:block;margin-bottom:8px}input,button{width:100%;min-height:46px;font:inherit;border-radius:8px;padding:10px;margin-bottom:16px}input{background:#202838;color:inherit;border:1px solid #59616a}button{background:#59ddc1;border:0;color:#08282a;font-weight:700}a{color:#59ddc1}</style>{% include "_startup.html" %}<script src="{{ static_url('/static/diagnostics.js') }}" async fetchpriority="low"></script></head>
<body><main><h1>管理员应急登录</h1><p>仅在指纹登录不可用时使用。日常请使用指纹登录保持会话。</p>
<form method="post" action="/login/legacy"><input type="hidden" name="return_to" value="{{ return_to }}"><label for="totp-input">6 位动态验证码</label><input id="totp-input" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button>验证登录</button></form><a href="/login">返回指纹登录</a></main></body></html>
